<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora colorida</title>
</head>
<body>
    <main class="calculadora">

        <output class="tela">0</output>

        <section class="teclas" aria-label="Teclado">
            <button class = "funcao">GT</button>
            <button class = "numero">7</button>
            <button class = "numero">8</button>
            <button class = "numero">9</button>
            <button class = "operacao">÷</button>
            <button class = "especial">%</button>
            <button class = "memoria">OFF</button>

            <button class = "funcao">→</button>
            <button class = "numero">4</button>
            <button class = "numero">5</button>
            <button class = "numero">6</button>
            <button class = "operacao">x</button>
            <button class = "especial">√</button>
            <button class = "memoria">MRC</button>

            <button class = "funcao">CE</button>
            <button class = "numero">1</button>
            <button class = "numero">2</button>
            <button class = "numero">3</button>
            <button class = "operacao">-</button>
            <button class = "resultado">=</button>
            <button class = "memoria">M-</button>

            <button class = "limpar">AC</button>
            <button class = "numero">0</button>
            <button class = "numero">00</button>
            <button class = "numero">.</button>
            <button class = "operacao">+</button>
            <button class = "memoria">M+</button>
            
        </section>
    </main>
    
</body>
</html>
